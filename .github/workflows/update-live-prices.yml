name: Update Live Prices

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl-cffi==0.7.4 beautifulsoup4==4.12.3

      - name: Scrape live prices
        run: |
          python scripts/scrape_live_prices.py

      - name: Commit and push updated prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/live-prices.json
          if git diff --staged --quiet; then
            echo "No price changes detected. Snapshot remains up to date."
          else
            git commit -m "chore(prices): update live-prices.json snapshot [skip ci]"
            git push
          fi

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F5" />
    <meta name="description" content="Compare beauty prices across Nykaa, Tira, Amazon India, Purplle and Myntra." />
    <title>PriceWise Beauty — Five stores. One better price.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <script>
      (() => {
        const route = new URLSearchParams(location.search).get('__pw_route');
        if (route && route.startsWith('/beauty/')) {
          const target = new URL(route, location.origin);
          if (target.origin === location.origin) history.replaceState(null, '', target.pathname + target.search + target.hash);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

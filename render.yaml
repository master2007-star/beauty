services:
  - type: web
    name: pricewise-beauty-api
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://master2007-star.github.io
      - key: ENABLE_LIVE_PRICES
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET_KEY
        generateValue: true
